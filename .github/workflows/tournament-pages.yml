name: Build and publish tournament
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tournament-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the importer, replay decoder and organizer rules
        run: python -m unittest discover -s tests -v
      - name: Build the index, published statistics and static site
        run: |
          python scripts/tournament_engine.py build
          node scripts/build_public_stats.cjs
          python scripts/tournament_engine.py site
      - name: Check replay playback against the recorded races
        run: |
          node tests/test_replay_client.js
          node tests/test_championship_client.js
      - name: Check award calculations, reveal gate and statistics
        run: |
          node tests/test_awards_client.js
          node tests/test_award_telemetry.js
          node tests/test_tournament_statistics.cjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
