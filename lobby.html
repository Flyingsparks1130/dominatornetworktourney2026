<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Lobby Results · UMA Legends Cup</title><link rel="stylesheet" href="assets/site.css"></head>
<body><script src="assets/site.js"></script><script>siteHeader("bracket");</script>
<main class="page"><div id="lobby-detail"></div></main>
<script>
(async()=>{const p=new URLSearchParams(location.search),round=Number(p.get("round")||1),lobby=Number(p.get("lobby")||1);const [idx,b,td]=await Promise.all([getJSON("data/index.json"),getJSON("data/bracket.json"),getJSON("config/clubs.json")]);const clubMap=Object.fromEntries(td.clubs.map(c=>[c.id,c]));const lobbyDef=(b.r1_lobbies||[]).find(x=>round===1&&x.lobby===lobby);const races=(idx.races||[]).filter(x=>x.round===round&&x.lobby===lobby).sort((a,b)=>a.race-b.race);const root=document.getElementById("lobby-detail");let html=`<div class="page-head"><div class="section-kicker mono">ROUND ${round}</div><h1>LOBBY ${lobby}</h1><p class="lead">${lobbyDef?lobbyDef.club_ids.map(id=>clubMap[id]?.name).filter(Boolean).map(esc).join(" · "):""}</p></div>`;if(!races.length)html+=`<div class="results-empty mono">NO RACES PUBLISHED FOR THIS LOBBY YET.</div>`;for(const meta of races){const race=await getJSON(meta.file);html+=`<article class="race-card"><div class="race-card-head"><strong>Race ${race.race}</strong><span class="micro">${esc(race.source_file||"")}</span></div><table class="result-table"><thead><tr><th>PLACE</th><th>UMA</th><th>TRAINER</th><th>GATE</th><th>TIME</th><th>PTS</th></tr></thead><tbody>${(race.results||[]).map(x=>`<tr><td>${x.place}</td><td>${esc(x.uma)}</td><td>${esc(x.display_trainer||x.trainer)}</td><td>${x.gate??"—"}</td><td>${esc(x.time_display||"—")}</td><td>${x.points??0}</td></tr>`).join("")}</tbody></table></article>`}root.innerHTML=html})().catch(console.error);
</script><script>siteFooter();</script></body></html>
